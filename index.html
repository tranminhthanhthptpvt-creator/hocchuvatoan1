<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <link rel="stylesheet" href="/style.css">
    <title>Bé Vui Học - Kéo Thả Chữ Cái & Chữ Số (GameTuongTac2D)</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
        <div id="rotate-prompt">
            <div class="rotate-icon">📱 ➔ 🔄 ➔ 📲</div>
            <div class="rotate-title">CHƠI VỚI ĐIỆN THOẠI NGANG</div>
            <div class="rotate-desc">
                Trò chơi cần nằm ngang để chữ to, nút bấm lớn và bé dễ kéo thả nhất!
            </div>
            <div class="rotate-buttons">
                <button id="force-landscape-btn" type="button" class="btn-primary">
                    🔄 Bật Chế Độ Xoay Ngang Màn Hình
                </button>
                <button id="close-rotate-btn" type="button" class="btn-secondary">
                    Chơi thu nhỏ ở màn hình dọc ➔
                </button>
            </div>
            <div class="rotate-tip">
                💡 <b>Mẹo cho phụ huynh:</b> Bật tính năng <i>"Tự động xoay màn hình" (Auto-rotate)</i> trên trung tâm điều khiển của điện thoại rồi nghiêng máy sang ngang nhé!
            </div>
        </div>
        <button id="landscape-toggle-floating" title="Ép xoay ngang màn hình" type="button">🔄 Xoay Ngang</button>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
